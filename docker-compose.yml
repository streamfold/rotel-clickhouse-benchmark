include:
  - docker-compose-otelcoll.yml
  - docker-compose-rotel.yml

networks:
  streamfold:
    driver: bridge

services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST_IP:-kafka-1.kafka-svc.kafka.svc.cluster.local}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_LOG_DIR: /data
    volumes:
      - /kafka/data:/data
    healthcheck:
      test: bash -c '(echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1'
      interval: 10s
      retries: 10
    networks:
      - streamfold

  hyper-dx:
    image: docker.hyperdx.io/hyperdx/hyperdx-local:2-beta
    environment:
      CLICKHOUSE_ENDPOINT: "http://clickhouse:8123"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      BETA_CH_OTEL_JSON_SCHEMA_ENABLED: "true"
    ports:
      - 8080:8080
    networks:
      - streamfold

  clickhouse:
    image: "clickhouse/clickhouse-server:${CHVER:-latest}"
    user: "101:101"
    hostname: clickhouse
    networks:
      - streamfold
    volumes:
      - ./config/clickhouse-server/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./config/clickhouse-server/users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./scripts/clickhouse-server/init-otel-db.sh:/docker-entrypoint-initdb.d/init-otel-db.sh
      - /clickhouse/lib:/var/lib/clickhouse
      - /clickhouse/log:/var/log/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    depends_on:
      - clickhouse-keeper

  clickhouse-keeper:
    image: "clickhouse/clickhouse-keeper:${CHKVER:-latest-alpine}"
    user: "101:101"
    hostname: clickhouse-keeper
    networks:
      - streamfold
    volumes:
      - ./config/clickhouse-keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml
    ports:
      - "127.0.0.1:9181:9181"

  telemetrygen:
    build:
      context: ./telemetrygen
    networks:
      - streamfold

  loadgen:
    image: streamfold/otel-loadgen
    networks:
      - streamfold

  loadgen-branch:
    build:
      context: ./loadgen
      args:
        GIT_BRANCH: ${LOADGEN_GIT_BRANCH:-main}
    networks:
      - streamfold

  clickhouse-ddl:
    image: streamfold/rotel-clickhouse-ddl
    networks:
      - streamfold
